[project]
name = "gcp-hello-world"
version = "0.1.0"
description = "Demo project to securely deploy a simple containerized Python script to Google Cloud Run"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "rich>=15.0.0",
]

[project.scripts]
gcp-hello-world = "gcp_hello_world:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
